<meta charset="utf-8">
<title>供應商對帳總覽（輝哥・肖總）</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@600;700&display=swap">
<style>
/* Layout: 帳本式儀表板 — 頂部結論列 → 月度圖 → 可搜尋廠商表 → 點選展開該廠商流水帳 */
:root{
  --bg:#f4f6f5; --surface:#ffffff; --surface-2:#eef1ef; --ink:#18201d; --ink-2:#4d5853; --muted:#76817c; --line:#dce2de;
  --ks:#2a78d6; --ks-soft:#e3eefb; --mg:#6b4fbb; --mg-soft:#efeafa; --sum:#9a6b00; --sum-soft:#fbf3dc;
  --pay:#1baf7a; --owe:#b8322a; --owe-soft:#fbe9e7; --credit:#1d7f54; --credit-soft:#e3f4ec; --focus:#2a78d6;
  --f-display:"Noto Serif TC","Songti TC","PMingLiU",serif;
  --f-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121614; --surface:#1a1f1d; --surface-2:#222826; --ink:#eef2ef; --ink-2:#bcc6c1; --muted:#8d9893; --line:#2f3733;
  --ks:#3987e5; --ks-soft:#1c2b3f; --mg:#a593ee; --mg-soft:#2a2440; --sum:#e0b44a; --sum-soft:#332a14;
  --pay:#199e70; --owe:#f07a70; --owe-soft:#3a1f1c; --credit:#4fc58f; --credit-soft:#16302a; --focus:#7fb0f0; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121614; --surface:#1a1f1d; --surface-2:#222826; --ink:#eef2ef; --ink-2:#bcc6c1; --muted:#8d9893; --line:#2f3733;
  --ks:#3987e5; --ks-soft:#1c2b3f; --mg:#a593ee; --mg-soft:#2a2440; --sum:#e0b44a; --sum-soft:#332a14;
  --pay:#199e70; --owe:#f07a70; --owe-soft:#3a1f1c; --credit:#4fc58f; --credit-soft:#16302a; --focus:#7fb0f0; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.55}
.wrap{max-width:1340px;margin:0 auto;padding-inline:16px;padding-block:28px 64px;display:grid;gap:28px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
header{display:grid;gap:6px}
.eyebrow{font-size:12px;letter-spacing:.12em;color:var(--muted)}
h1{font-family:var(--f-display);font-size:clamp(26px,4vw,34px);margin:0;line-height:1.2;text-wrap:balance}
.stamp{display:flex;flex-wrap:wrap;gap:8px 18px;color:var(--ink-2);font-size:13px}
.stamp b{color:var(--ink);font-weight:500}
h2{font-family:var(--f-display);font-size:20px;margin:0}
.sec{display:grid;gap:12px;min-width:0}
.sec-head{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:8px 16px}
.sub{color:var(--muted);font-size:12.5px}
/* KPI */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.kpi{background:var(--surface);padding:16px 18px;display:grid;gap:4px;align-content:start;min-width:0}
.kpi .lab{font-size:12.5px;color:var(--ink-2);display:flex;align-items:center;gap:6px}
.kpi .val{font-family:var(--f-num);font-variant-numeric:tabular-nums;font-size:clamp(17px,2.2vw,22px);font-weight:600;overflow-wrap:anywhere}
.kpi .note{font-size:12px;color:var(--muted)}
.dot{width:8px;height:8px;border-radius:2px;display:inline-block;flex:none}
.kpi.owe .val{color:var(--owe)}
@media (max-width:820px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:440px){.kpis{grid-template-columns:1fr}}
/* chart */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;min-width:0}
.legend{display:flex;gap:16px;font-size:12.5px;color:var(--ink-2);flex-wrap:wrap}
.legend span{display:inline-flex;align-items:center;gap:6px}
.chart-box{position:relative;overflow-x:auto}
svg text{fill:var(--muted);font-family:var(--f-num);font-size:11px}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--bg);padding:8px 10px;border-radius:6px;font-size:12px;line-height:1.5;white-space:nowrap;transform:translate(-50%,-100%);z-index:3}
.tip .num{font-size:12px}
details.raw summary{cursor:pointer;color:var(--ink-2);font-size:12.5px;margin-top:8px}
/* controls */
.controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.search{flex:1 1 220px;min-width:0;padding:8px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);font:inherit}
.chip{border:1px solid var(--line);background:var(--surface);color:var(--ink-2);border-radius:999px;padding:6px 12px;font:inherit;font-size:13px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
button:focus-visible,input:focus-visible,tr:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
/* table */
.tbl-box{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:8px 10px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--line)}
th{position:sticky;top:0;background:var(--surface-2);font-weight:500;color:var(--ink-2);font-size:12.5px;z-index:1}
th.l,td.l{text-align:left}
th[data-k]{cursor:pointer;user-select:none}
th[data-k]:hover{color:var(--ink)}
th .arr{font-size:10px;margin-left:3px;color:var(--muted)}
.grp th{font-size:12px;text-align:center;padding:5px 10px;border-bottom:0}
.g-ks{box-shadow:inset 0 3px 0 var(--ks)} .g-mg{box-shadow:inset 0 3px 0 var(--mg)} .g-sum{box-shadow:inset 0 3px 0 var(--sum)}
td.mgc{background:var(--mg-soft)} td.sumc{background:var(--sum-soft)}
tbody tr.v{cursor:pointer}
tbody tr.v:hover td{background:var(--surface-2)}
tbody tr.sel td{background:var(--ks-soft)}
tfoot td{font-weight:600;background:var(--surface-2);border-bottom:0}
.code{color:var(--muted);font-family:var(--f-num);font-size:12px}
.vname{font-weight:500}
.pill{display:inline-block;font-size:11px;padding:1px 7px;border-radius:999px;margin-left:6px;vertical-align:1px;font-weight:500}
.p-mg{background:var(--mg-soft);color:var(--mg)}
.bal{font-weight:600}
.bal.owe{color:var(--owe)} .bal.cr{color:var(--credit)}
.zero{color:var(--muted)}
/* detail */
.detail{display:grid;gap:14px}
.d-head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:8px}
.d-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.d-card{border:1px solid var(--line);border-radius:8px;padding:10px 12px;display:grid;gap:2px;background:var(--surface)}
.d-card .lab{font-size:12px;color:var(--ink-2)}
.d-card .val{font-family:var(--f-num);font-variant-numeric:tabular-nums;font-weight:600;font-size:16px}
.d-card.ks{border-top:3px solid var(--ks)} .d-card.mg{border-top:3px solid var(--mg)} .d-card.sum{border-top:3px solid var(--sum)}
.flow td{font-size:12.5px}
.flow tr.mg td{background:var(--mg-soft)}
.flow td.desc{text-align:left;white-space:normal;min-width:220px;max-width:420px}
.tag{font-size:11px;padding:1px 6px;border-radius:4px;border:1px solid var(--line);color:var(--ink-2)}
.tag.ship{color:var(--ks);border-color:var(--ks)} .tag.pay{color:var(--credit);border-color:var(--credit)}
.empty{padding:24px;text-align:center;color:var(--muted)}
.foot{color:var(--muted);font-size:12px;display:grid;gap:4px}
.close{border:1px solid var(--line);background:var(--surface);color:var(--ink-2);border-radius:6px;padding:4px 10px;cursor:pointer;font:inherit;font-size:12.5px}
@media (prefers-reduced-motion:no-preference){tbody tr.v td{transition:background .12s}}
h3{font-family:var(--f-display);font-size:16px;margin:0}
.rq{display:grid;gap:14px}
.dlab{font-size:13px;color:var(--ink-2)}
.date{padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);font:inherit;font-family:var(--f-num)}
.qchips{display:flex;flex-wrap:wrap;gap:6px}
.rkpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.rk{border:1px solid var(--line);border-radius:8px;padding:10px 12px;display:grid;gap:2px;min-width:0}
.rk .lab{font-size:12px;color:var(--ink-2);display:flex;align-items:center;gap:6px}
.rk .val{font-family:var(--f-num);font-variant-numeric:tabular-nums;font-weight:600;font-size:17px;overflow-wrap:anywhere}
.rgrid{display:grid;grid-template-columns:minmax(0,1fr);gap:20px}
@media (max-width:900px){.rkpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.mt td.barc{min-width:230px}
.bw{display:flex;align-items:center;gap:8px;justify-content:flex-end}
.bar{height:8px;border-radius:2px;flex:none}
.bar.s{background:var(--ks)} .bar.p{background:var(--pay)}
.bw .num{min-width:96px;text-align:right}
.yr td{background:var(--surface-2);font-weight:600;font-size:12px;color:var(--ink-2)}
.tog{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--ink-2);cursor:pointer}
[hidden]{display:none!important}
.lock{min-height:80vh;display:grid;place-items:center;padding-inline:16px;padding-block:40px}
.lockcard{width:100%;max-width:380px;display:grid;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:24px}
.unl{background:var(--ink);color:var(--bg);border-color:var(--ink);padding:9px 14px;font-size:14px}
.unl:disabled{opacity:.6}
.hui{display:grid;gap:14px}
.huirow{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;justify-content:space-between}
tfoot tr.huitr td{background:var(--sum-soft);font-weight:500;cursor:pointer}
.p-hui{background:var(--sum-soft);color:var(--sum)}
</style>

<div class="lock" id="lock" hidden>
  <form class="lockcard" id="lockf" autocomplete="off">
    <div class="eyebrow">WIN VALUE TRADING · 阿輝帳務系統</div>
    <h1>供應商對帳總覽｜輝哥・肖總</h1>
    <p class="sub">這份帳務已加密。輸入密碼即可查看。</p>
    <input class="search" id="pw" type="password" placeholder="密碼" aria-label="密碼" autocomplete="current-password">
    <label class="tog"><input type="checkbox" id="rem" checked>在這台裝置記住（下次免輸入）</label>
    <button class="chip unl" id="unl" type="submit">解鎖</button>
    <div class="sub" id="lmsg" role="status"></div>
  </form>
</div>
<div class="wrap">
  <header>
    <div class="eyebrow">WIN VALUE TRADING · 阿輝帳務系統</div>
    <h1>供應商對帳總覽｜輝哥・肖總</h1>
    <div class="stamp" id="stamp"></div>
  </header>

  <section class="kpis" id="kpis" aria-label="結算重點"></section>

  <section class="sec" id="huiSec" hidden>
    <div class="sec-head">
      <h2>輝哥往來（黄辉／吉佑國際）</h2>
      <span class="sub" id="huiSub"></span>
    </div>
    <div class="panel hui">
      <div class="rkpis" id="fund"></div>
      <div class="sub" id="mgHead" style="font-weight:500;color:var(--ink-2)"></div>
      <div class="rkpis" id="fundMg"></div>
      <div class="huirow">
        <div class="sub" id="huiNote"></div>
        <button class="close" id="huiOpen" type="button">看輝哥本人流水</button>
      </div>
    </div>
  </section>

  <section class="sec" id="range">
    <div class="sec-head">
      <h2>區間查詢</h2>
      <span class="sub">選起迄日期，看這段期間的出貨、付款與各廠商明細。付款含明哥直付（已去重）。</span>
    </div>
    <div class="panel rq">
      <div class="controls">
        <label class="dlab" for="d1">起</label><input class="date" id="d1" type="date">
        <label class="dlab" for="d2">迄</label><input class="date" id="d2" type="date">
        <div class="qchips" id="qchips">
          <button class="chip" data-r="m1">本月</button><button class="chip" data-r="m3">近3個月</button><button class="chip" data-r="m6">近6個月</button><button class="chip" data-r="m12">近12個月</button><button class="chip" data-r="ytd">今年</button><button class="chip" data-r="ly">去年</button><button class="chip" data-r="all">全部</button>
        </div>
      </div>
      <div class="rkpis" id="rkpis"></div>
    </div>
    <div class="rgrid">
      <div class="sec">
        <div class="sec-head"><h3>每月明細</h3><div class="legend"><span><i class="dot" style="background:var(--ks)"></i>出貨</span><span><i class="dot" style="background:var(--pay)"></i>付款</span><span class="sub">新月份在上</span></div></div>
        <div class="tbl-box" style="max-height:520px"><table id="mtable" class="mt"></table></div>
      </div>
      <div class="sec">
        <div class="sec-head"><h3>區間內各廠商</h3><span class="sub">點廠商看區間內流水</span></div>
        <div class="tbl-box" style="max-height:520px"><table id="rvt"></table></div>
      </div>
    </div>
  </section>

  <section class="sec">
    <div class="sec-head">
      <h2>廠商對帳總表</h2>
      <span class="sub">分軌＋加總：藍＝凱勝、紫＝明哥（基準法）、黃＝加總。點一列看該廠商流水帳。</span>
    </div>
    <div class="controls">
      <input class="search" id="q" type="search" placeholder="搜尋廠商名稱或編號（例：华恒、V02）" aria-label="搜尋廠商">
      <button class="chip" data-f="all" aria-pressed="true">全部</button>
      <button class="chip" data-f="owe" aria-pressed="false">尚欠廠商</button>
      <button class="chip" data-f="cr" aria-pressed="false">多付</button>
      <button class="chip" data-f="mg" aria-pressed="false">有明哥往來</button>
    </div>
    <div class="tbl-box" style="max-height:620px">
      <table id="vt"></table>
    </div>
  </section>

  <section class="sec" id="detailSec" hidden>
    <div class="panel detail" id="detail"></div>
  </section>

  <section class="sec" id="xiaoSec" hidden>
    <div class="sec-head">
      <h2>肖總往來</h2>
      <span class="sub" id="xiaoSub"></span>
    </div>
    <div class="panel hui"><div class="rkpis" id="xiaoK"></div></div>
    <div class="controls">
      <button class="chip" data-x="bg" aria-pressed="true">報關行明細（R）</button>
      <button class="chip" data-x="rmb" aria-pressed="false">人民幣收支（RMB）</button>
      <button class="chip" data-x="cust" aria-pressed="false">客戶彙總</button>
      <input class="search" id="xq" type="search" placeholder="搜尋 PO／WAYBILL／品名" aria-label="搜尋肖總明細">
    </div>
    <div class="tbl-box" style="max-height:520px"><table id="xt"></table></div>
    <div class="sub" id="xiaoNote" style="margin-top:6px"></div>
  </section>

  <div class="foot" id="foot"></div>

<script>
const RAW=document.getElementById('data').textContent.trim();
if(RAW==='__'+'DATA__'){document.querySelector('.wrap').innerHTML='<header><h1>供應商對帳總覽（範本）</h1><p>這是網頁範本，裡面沒有資料。請開啟「阿輝對帳系統」資料夾裡的「輝哥帳對帳總覽.html」，或 Claude 上已發布的網頁。</p></header>';throw new Error('template only')}
const B64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function deriveKey(pw,salt,iter){const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:iter,hash:'SHA-256'},base,{name:'AES-GCM',length:256},true,['decrypt'])}
async function openWith(key,E){const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:B64(E.iv)},key,B64(E.ct));return JSON.parse(new TextDecoder().decode(pt))}
(async()=>{
  const P=JSON.parse(RAW);
  if(!P.enc){main(P);return}
  const E=P.enc,wrap=document.querySelector('.wrap'),lock=document.getElementById('lock');
  wrap.hidden=true;lock.hidden=false;
  const KS='hg-key-'+E.salt.slice(0,12);
  try{const raw=localStorage.getItem(KS);if(raw){const key=await crypto.subtle.importKey('raw',B64(raw),{name:'AES-GCM'},true,['decrypt']);const D=await openWith(key,E);lock.hidden=true;wrap.hidden=false;main(D);return}}catch(e){try{localStorage.removeItem(KS)}catch(_){}}
  document.getElementById('pw').focus();
  document.getElementById('lockf').addEventListener('submit',async ev=>{ev.preventDefault();const btn=document.getElementById('unl'),msg=document.getElementById('lmsg');
    btn.disabled=true;msg.textContent='解鎖中…';
    try{const key=await deriveKey(document.getElementById('pw').value,B64(E.salt),E.iter);const D=await openWith(key,E);
      if(document.getElementById('rem').checked){try{const raw=new Uint8Array(await crypto.subtle.exportKey('raw',key));localStorage.setItem(KS,btoa(String.fromCharCode(...raw)))}catch(_){}}
      lock.hidden=true;wrap.hidden=false;main(D)}
    catch(e){msg.textContent='密碼不正確，請再試一次。';btn.disabled=false;document.getElementById('pw').select()}});
})();
function lockAgain(){try{for(const k of Object.keys(localStorage))if(k.startsWith('hg-key-'))localStorage.removeItem(k)}catch(e){}location.reload()}
function main(DATA){
const $=s=>document.querySelector(s);
const yen=n=>(Number(n)<0?'−¥':'¥')+fmt(Math.abs(Number(n)),2);
const fmt=(n,dp)=>{if(n===null||n===undefined||n==='')return '';const v=Number(n);if(!isFinite(v))return '';const d=dp!==undefined?dp:(Math.abs(v-Math.round(v))>0.004?2:0);return v.toLocaleString('en-US',{minimumFractionDigits:d,maximumFractionDigits:d})};
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const M=DATA.meta;

$('#stamp').innerHTML=`<span>資料截至 <b class="num">${esc(M.date)}</b></span><span>出貨入帳至 <b>${esc(M.lastBatch)}</b>（<span class="num">${esc(M.lastBatchDate)}</span>）</span><span>付款入帳至 <b>${esc(M.lastLiudong)}</b></span><span>廠商 <b class="num">${DATA.vendors.length}</b> 家</span>`;

// KPI
const K=DATA.kpi;
const kpis=[
  {lab:'出貨合計（凱勝口徑）',dot:'var(--ks)',val:K.ksShip,note:`另明哥過路出貨 ${yen(K.mgShip)}`},
  {lab:'已付廠商貨款',dot:'var(--pay)',val:K.paid,note:'阿輝流水「厂商货款」'},
  {lab:'應付餘額（凱勝口徑）',dot:'var(--owe)',val:K.balance,note:`含待分類 ${yen(K.unclassified)}（待認領）`,cls:'owe'},
  {lab:'明哥尚欠（基準法）',dot:'var(--mg)',val:K.mgOwe,note:`华恒期初 ${yen(K.mgOpen)} 起算・廠商小計`}
];
$('#kpis').innerHTML=kpis.map(k=>`<div class="kpi ${k.cls||''}"><div class="lab"><i class="dot" style="background:${k.dot}"></i>${k.lab}</div><div class="val">${yen(k.val)}</div><div class="note">${esc(k.note)}</div></div>`).join('');

// ---- 區間查詢 ----
const VALL=DATA.hui?DATA.vendors.concat([DATA.hui]):DATA.vendors;
const ALL=[];for(const v of VALL)for(const f of (DATA.flows[v.name]||[]))if(/^\d{4}-\d{2}-\d{2}$/.test(f[0]))ALL.push([f[0],v.name,f[4]||0,f[5]||0,f[6]==='明哥']);
const minD=ALL.reduce((m,x)=>x[0]<m?x[0]:m,'9999'),maxD=ALL.reduce((m,x)=>x[0]>m?x[0]:m,'0000');
const iso=d=>d.toISOString().slice(0,10);
const today=new Date(M.date+'T00:00:00Z');
const ym=(y,m)=>new Date(Date.UTC(y,m,1));
function preset(r){const y=today.getUTCFullYear(),m=today.getUTCMonth();
  if(r==='m1')return[iso(ym(y,m)),M.date];if(r==='m3')return[iso(ym(y,m-2)),M.date];if(r==='m6')return[iso(ym(y,m-5)),M.date];
  if(r==='m12')return[iso(ym(y,m-11)),M.date];if(r==='ytd')return[`${y}-01-01`,M.date];if(r==='ly')return[`${y-1}-01-01`,`${y-1}-12-31`];return[minD,maxD]}
let R={d1:'',d2:'',p:'m12'};
try{const s=JSON.parse(localStorage.getItem('hg-range')||'{}');if(s.p||s.d1)R=Object.assign(R,s)}catch(e){}
if(R.p){[R.d1,R.d2]=preset(R.p)}
const inR=d=>d>=R.d1&&d<=R.d2;
function renderRange(){
  $('#d1').value=R.d1;$('#d2').value=R.d2;
  document.querySelectorAll('#qchips .chip').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.r===R.p)));
  const rows=ALL.filter(x=>inR(x[0]));
  let S=0,MS=0,P=0;const byM={},byV={};
  for(const [d,v,sh,pa,mg] of rows){S+=sh;P+=pa;if(mg)MS+=sh;const k=d.slice(0,7);(byM[k]=byM[k]||[0,0,0]);byM[k][0]+=sh;byM[k][2]+=pa;if(mg)byM[k][1]+=sh;
    const o=byV[v]=byV[v]||{s:0,ms:0,p:0,n:0};o.s+=sh;o.p+=pa;if(mg)o.ms+=sh;o.n++}
  const net=S-P;
  $('#rkpis').innerHTML=[['出貨','var(--ks)',S,`其中明哥 ${yen(MS)}`],['付款','var(--pay)',P,`${rows.filter(x=>x[3]).length} 筆`],['出貨－付款','var(--sum)',net,net>0?'期間內出多於付':'期間內付多於出'],['往來廠商','var(--muted)',null,`共 ${rows.length} 筆流水`]]
    .map(([l,c,v,n])=>`<div class="rk"><span class="lab"><i class="dot" style="background:${c}"></i>${l}</span><span class="val">${v===null?Object.keys(byV).length+' 家':yen(v)}</span><span class="sub">${esc(n)}</span></div>`).join('');

  if(!ms.length)h+=`<tr><td colspan="5" class="empty">這段期間沒有出貨或付款</td></tr>`;
  for(const k of ms){const y=k.slice(0,4);if(y!==yr){yr=y;const t=ms.filter(x=>x.startsWith(y)).reduce((a,x)=>[a[0]+byM[x][0],a[1]+byM[x][2]],[0,0]);h+=`<tr class="yr"><td class="l">${y} 年</td><td class="num">${fmt(t[0],2)}</td><td></td><td class="num">${fmt(t[1],2)}</td><td class="num">${fmt(t[0]-t[1],2)}</td></tr>`}
    const [sh,mg,pa]=byM[k];h+=`<tr><td class="l num">${k}</td><td class="barc"><div class="bw"><i class="bar s" style="width:${Math.round(sh/mx*120)}px"></i><span class="num">${fmt(sh,2)}</span></div></td><td class="num">${mg?fmt(mg,2):'<span class="zero">—</span>'}</td><td class="barc"><div class="bw"><i class="bar p" style="width:${Math.round(pa/mx*120)}px"></i><span class="num">${fmt(pa,2)}</span></div></td><td class="num">${balCell(sh-pa)}</td></tr>`}
  $('#mtable').innerHTML=h+'</tbody>';

  $('#rvt').innerHTML=`<thead><tr><th class="l">廠商</th><th>出貨</th><th>其中明哥</th><th>付款</th><th>出貨－付款</th><th>筆數</th></tr></thead><tbody>${vs.length?vs.map(([n,o])=>`<tr class="v" tabindex="0" data-n="${esc(n)}"><td class="l"><span class="vname">${esc(n)}</span></td><td class="num">${fmt(o.s,2)||'0.00'}</td><td class="num">${o.ms?fmt(o.ms,2):'<span class="zero">—</span>'}</td><td class="num">${fmt(o.p,2)||'0.00'}</td><td class="num">${balCell(o.s-o.p)}</td><td class="num">${o.n}</td></tr>`).join(''):`<tr><td colspan="6" class="empty">這段期間沒有資料</td></tr>`}</tbody><tfoot><tr><td class="l">合計</td><td class="num">${fmt(S,2)}</td><td class="num">${fmt(MS,2)}</td><td class="num">${fmt(P,2)}</td><td class="num">${balCell(net)}</td><td class="num">${rows.length}</td></tr></tfoot>`;
}

// Vendor table
const COLS=[
 {k:'code',t:'編號',l:1},{k:'name',t:'廠商',l:1},
 {k:'ksShip',t:'凱勝出貨',g:'ks'},{k:'ksPaid',t:'凱勝已付',g:'ks'},{k:'ksBal',t:'凱勝餘額',g:'ks',bal:1},
 {k:'mgOpen',t:'明哥期初',g:'mg'},{k:'mgShip',t:'明哥出貨',g:'mg'},{k:'mgPaid',t:'明哥已付',g:'mg'},{k:'mgBal',t:'明哥餘額',g:'mg',bal:1},

const balCell=v=>{if(v===null||v===undefined||Math.abs(v)<0.005)return `<span class="zero">0</span>`;return `<span class="bal ${v>0?'owe':'cr'}">${fmt(v,2)}</span>`};
function rows(){let r=DATA.vendors.slice();const q=st.q.trim().toLowerCase();
  if(q)r=r.filter(v=>(v.name+' '+v.code).toLowerCase().includes(q));
  if(st.f==='owe')r=r.filter(v=>v.bal>0.005);if(st.f==='cr')r=r.filter(v=>v.bal<-0.005);if(st.f==='mg')r=r.filter(v=>v.hasMg);
  if(st.sk){const k=st.sk;r.sort((a,b)=>{const x=a[k],y=b[k];if(k==='code'){if(!x&&!y)return 0;if(!x)return 1;if(!y)return -1;return x.localeCompare(y,'en',{numeric:true})*st.sd}if(typeof x==='string'||typeof y==='string')return String(x??'').localeCompare(String(y??''),'zh')*st.sd;return((x??0)-(y??0))*st.sd})}
  return r}
function render(){const r=rows();
  const grp=`<tr class="grp"><th colspan="2"></th><th colspan="3" class="g-ks">凱勝</th><th colspan="4" class="g-mg">明哥（基準法）</th><th colspan="3" class="g-sum">加總</th></tr>`;

  const body=r.length?r.map(v=>`<tr class="v ${st.sel===v.name?'sel':''}" tabindex="0" data-n="${esc(v.name)}">${COLS.map(c=>{const val=v[c.k];
    if(c.k==='code')return `<td class="l code">${esc(val)}</td>`;
    if(c.k==='name')return `<td class="l"><span class="vname">${esc(val)}</span>${v.hasMg?'<span class="pill p-mg">明哥</span>':''}</td>`;
    const cls=(c.g==='mg'&&v.hasMg?'mgc ':'')+(c.k==='bal'?'sumc ':'')+'num';
    return `<td class="${cls}">${c.bal?balCell(val):(val?fmt(val,2):'<span class="zero">—</span>')}</td>`}).join('')}</tr>`).join('')
    :`<tr><td colspan="${COLS.length}" class="empty">沒有符合的廠商</td></tr>`;
  const T=DATA.total;const H=DATA.hui;const hrow=H&&H.parts&&H.parts.length?`<tr class="huitr" data-n="${esc(H.name)}" tabindex="0"><td class="l" colspan="2">${esc(H.name)}<span class="pill p-hui">非廠商</span></td>${COLS.slice(2).map(c=>`<td class="num">${c.bal?balCell(H[c.k]):(H[c.k]?fmt(H[c.k],2):'<span class="zero">—</span>')}</td>`).join('')}</tr>`:'';const foot=hrow+`<tr><td class="l" colspan="2">總計（${DATA.vendors.length} 家廠商＋輝哥本人）</td>${COLS.slice(2).map(c=>`<td class="num">${c.bal?balCell(T[c.k]):fmt(T[c.k],2)}</td>`).join('')}</tr>`;
  $('#vt').innerHTML=`<thead>${grp}${head}</thead><tbody>${body}</tbody><tfoot>${foot}</tfoot>`;
  document.querySelectorAll('.chip').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.f===st.f)));
}

  const tr=e.target.closest('tr.v,tr.huitr');if(tr)openV(tr.dataset.n)});

  const tbl=fl.length?`<div class="tbl-box" style="max-height:560px"><table class="flow"><thead><tr><th class="l">日期</th><th class="l">類型</th><th class="l">單據/編號</th><th class="l">摘要</th><th>出貨</th><th>付款</th><th class="l">歸屬</th><th>累計餘額</th></tr></thead><tbody>${

  $('#detail').innerHTML=`<div class="d-head"><h2>${esc(v.name)} <span class="code">${esc(v.code)}</span></h2><button class="close" id="closeD">收起</button></div>${cards}<div class="controls"><label class="tog"><input type="checkbox" id="onlyR" ${onlyR?'checked':''}>只顯示區間內（${R.d1} ～ ${R.d2}）</label><span class="sub">新的在上、舊的在下；累計餘額為該筆之後的全期累計（含基準日前明哥舊帳）；紫底＝明哥列。</span></div>${tbl}`;
  $('#detailSec').hidden=false;$('#onlyR').onchange=e=>openV(n,e.target.checked);$('#closeD').onclick=()=>{$('#detailSec').hidden=true;st.sel=null;render()};

if(DATA.hui){const F=DATA.fund,H=DATA.hui;$('#huiSec').hidden=false;

function renderXiaoSec(X){
  $('#xiaoSec').hidden=false;
  $('#xiaoSub').textContent=`報關行帳＝蘭特R、人民幣帳＝RMB・資料日期 ${X.date}`;
  const rnd=n=>(Number(n)<0?'−R':'R')+fmt(Math.abs(Number(n)),2);
  const rmbF=n=>(Number(n)<0?'−¥':'¥')+fmt(Math.abs(Number(n)),2);
  const S=X.summ,bgT=S.bgs[3];
  $('#xiaoK').innerHTML=[
    ['人民幣帳結餘','var(--owe)',rmbF(S.rmb.bal),`期初 ${rmbF(S.rmb.init)}・收入 ${rmbF(S.rmb.inc)}・支出 ${rmbF(S.rmb.exp)}`],

    ['報關行 2025／2025B','var(--muted)',rnd(S.bgs[0][4])+'／'+rnd(S.bgs[1][4]),'2025已清；2025B尚欠'],
    ['報關行 2026','var(--owe)',rnd(S.bgs[2][4]),`期初 ${rnd(S.bgs[2][1])} 起算`]
  ].map(([l,c,v,n])=>`<div class="rk"><span class="lab"><i class="dot" style="background:${c}"></i>${l}</span><span class="val">${v}</span><span class="sub">${esc(n)}</span></div>`).join('');
  $('#xiaoNote').innerHTML='⚠ 待確認：2025B 年末結餘 −183,434.99，但 2026 帳期初 −156,675，相差 26,760。對應 Excel：肖總對帳系統／肖總帳務系統.xlsx。';
  let xv='bg',xq='';
  const F2=n=>n==null?'':fmt(n,2),F0=n=>n==null?'':fmt(n,0);
  function xrender(){
    const t=$('#xt');
    if(xv==='bg'){
      const rows=X.bg.filter(r=>!xq||[r[5],r[6],r[9],r[16]].join(' ').toUpperCase().includes(xq));
      let sd=0,sp=0;rows.forEach(r=>{sd+=r[14]||0;sp+=r[15]||0});
      t.innerHTML=`<thead><tr><th>#</th><th class="l">帳本</th><th class="l">類型</th><th>出運日</th><th class="l">WAYBILL</th><th class="l">訂單號</th><th class="l">客戶</th><th class="l">品名</th><th>件數</th><th>單件清費</th><th>應付R</th><th>支付R</th><th class="l">備註</th></tr></thead><tbody>`+
      rows.map(r=>`<tr class="v"><td class="num">${r[0]}</td><td class="l">${esc(r[1])}</td><td class="l">${esc(r[2]||'')}</td><td class="num">${esc(r[3]||'')}</td><td class="l">${esc(r[5]||'')}</td><td class="l">${esc(r[6]||'')}</td><td class="l">${esc(r[7]||'')}</td><td class="l">${esc(r[9]||'')}</td><td class="num">${F0(r[10])}</td><td class="num">${F2(r[11])}</td><td class="num">${F2(r[14])}</td><td class="num">${F2(r[15])}</td><td class="l">${esc(r[16]||'')}</td></tr>`).join('')+
      `</tbody><tfoot><tr><td colspan="10" class="l">小計（${rows.length}筆）</td><td class="num">${F2(sd)}</td><td class="num">${F2(sp)}</td><td></td></tr></tfoot>`;
    }else if(xv==='rmb'){
      const rows=X.rmb.filter(r=>!xq||[r[2],r[3],r[5],r[11]].join(' ').toUpperCase().includes(xq));
      let si=0,se=0;rows.forEach(r=>{si+=r[9]||0;se+=r[10]||0});
      t.innerHTML=`<thead><tr><th>#</th><th>日期</th><th class="l">摘要</th><th class="l">描述</th><th class="l">客戶</th><th class="l">訂單內容</th><th>數量</th><th>發票額</th><th>收入¥</th><th>支出¥</th><th class="l">備註</th></tr></thead><tbody>`+
      rows.map(r=>`<tr class="v"><td class="num">${r[0]}</td><td class="num">${esc(r[1]||'')}</td><td class="l">${esc(r[2]||'')}</td><td class="l">${esc(r[3]||'')}</td><td class="l">${esc(r[4]||'')}</td><td class="l">${esc(r[5]||'')}</td><td class="num">${F0(r[7])}</td><td class="num">${F2(r[8])}</td><td class="num">${F2(r[9])}</td><td class="num">${F2(r[10])}</td><td class="l">${esc(r[11]||'')}</td></tr>`).join('')+
      `</tbody><tfoot><tr><td colspan="8" class="l">小計（${rows.length}筆）</td><td class="num">${F2(si)}</td><td class="num">${F2(se)}</td><td></td></tr></tfoot>`;
    }else{
      t.innerHTML=`<thead><tr><th class="l">客戶</th><th>應付R</th><th>件數</th></tr></thead><tbody>`+
      X.summ.cust.map(r=>`<tr class="v"><td class="l">${esc(r[0])}</td><td class="num">${F2(r[1])}</td><td class="num">${F0(r[2])}</td></tr>`).join('')+'</tbody>';
    }
  }
  document.querySelectorAll('#xiaoSec .chip[data-x]').forEach(b=>b.onclick=()=>{
    xv=b.dataset.x;document.querySelectorAll('#xiaoSec .chip[data-x]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));xrender();});
  $('#xq').oninput=e=>{xq=e.target.value.toUpperCase();xrender()};

}
